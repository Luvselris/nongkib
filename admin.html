<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard ♡ Nongkib</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-cream: #fffaf5;
      --bg-peach: #fcdfd9;
      --bg-sage: #eef6de;
      --card-bg: rgba(255, 253, 250, 0.96);
      --border-soft: #f3d7cf;
      --accent-red: #d95a4b;
      --accent-red-deep: #b84336;
      --accent-green: #9ec45b;
      --text-main: #4a3532;
      --text-muted: #8c6d68;
      --shadow: 0 10px 28px rgba(217, 90, 75, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg-cream) 50%, var(--bg-peach) 88%, var(--bg-sage) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 480px; }
    #loginView { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }

    .login-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-soft);
      text-align: center;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      font-size: 13.5px;
      background: #ffffff;
      color: var(--text-main);
      outline: none;
      margin-bottom: 12px;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--accent-red);
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-red-deep));
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(217, 90, 75, 0.25);
    }

    .btn-outline {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      color: var(--accent-red);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    #dashboardView { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }

    .panel-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-soft);
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-red);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hl-admin-card {
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .story-slot {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px dashed var(--border-soft);
      overflow: hidden;
      background: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-slot img { width: 100%; height: 100%; object-fit: cover; }

    .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(184, 67, 54, 0.9);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView">
      <div class="login-card">
        <h2 style="color:var(--accent-red); margin-bottom:20px;">Admin Login ♡ Nongkib</h2>
        <form onsubmit="handleLogin(event)">
          <input type="email" id="emailInput" class="input-field" placeholder="Phattharapornn.27@gmail.com" required>
          <input type="password" id="passwordInput" class="input-field" placeholder="••••••••••••" required>
          <button type="submit" class="btn-main">เข้าสู่ระบบ ✨</button>
          <p id="loginError" style="color:#d95a4b; font-size:12px; margin-top:10px; display:none;">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight:700; color:var(--accent-red); font-size:18px;">Dashboard ♡ Nongkib</div>
        <button type="button" onclick="handleLogout()" class="btn-outline">ออกระบบ</button>
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>🎀 ข้อมูลร้านและรูปภาพ</span></div>
        <input type="text" id="storeNameInput" class="input-field" placeholder="Nongkib">
        <textarea id="storeBioInput" class="textarea-field" rows="4" placeholder="ข้อความแนะนำร้าน..."></textarea>

        <div style="margin-bottom:12px;">
          <label style="font-size:12px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:4px;">รูปแบนเนอร์ (ไม่จำกัดขนาด):</label>
          <input type="file" accept="image/*" onchange="uploadDirect(event, 'bannerImg')">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:4px;">รูปโปรไฟล์ (ไม่จำกัดขนาด):</label>
          <input type="file" accept="image/*" onchange="uploadDirect(event, 'profileImg')">
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-title"><span>🔗 ช่องทางติดต่อ & เพลง</span></div>
        <input type="text" id="lineLabelInput" class="input-field" placeholder="ไลน์ออฟ @556vbotd">
        <input type="url" id="lineUrlInput" class="input-field" placeholder="https://lin.ee/5YAa4Be">
        <input type="text" id="fbLabelInput" class="input-field" placeholder="เฟส">
        <input type="url" id="fbUrlInput" class="input-field" placeholder="https://www.facebook.com/share/1FXdtEkamE/">
        <input type="url" id="musicUrlInput" class="input-field" placeholder="ลิงก์ไฟล์เสียง .mp3">
      </div>

      <div class="panel-card">
        <div class="panel-title">
          <span>✨ ไฮไลท์ (ไม่จำกัดจำนวน)</span>
          <button type="button" class="btn-outline" style="padding:4px 10px; font-size:11px;" onclick="addNewHighlight()">+ เพิ่มไฮไลท์ใหม่</button>
        </div>
        <input type="text" id="highlightsTitleInput" class="input-field" placeholder="Moo Krob">
        <div id="hlAdminList"></div>
      </div>

      <button type="button" class="btn-main" id="saveBtn" style="font-size:15px; padding:14px; margin-bottom:20px;" onclick="saveAll()">
        ☁️ บันทึกขึ้นระบบทันที (หน้าเว็บเปลี่ยนสด) ♡
      </button>

      <div class="panel-card">
        <div class="panel-title"><span>💬 จัดการรีวิวจากลูกค้า</span></div>
        <div id="reviewsBox"></div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_EMAIL = "Phattharapornn.27@gmail.com";
    const AUTH_PASS = "Kay27052552";

    const DB_CONFIG = "nongkib_config";
    const DB_HL = "nongkib_highlights";
    const DB_REVIEWS = "nongkib_reviews";

    const DEFAULT_BANNER = "https://files.catbox.moe/68y4at.gif";
    const DEFAULT_PROFILE = "https://files.catbox.moe/tfihpe.jpeg";
    const DEFAULT_BIO = "welcome to Nongkib shop\nOpen 09:00 – 22:00\nรับแลกเงิน ส่งสติ๊กเกอร์ไลน์ แอพพรี เติมเกม";
    const DEFAULT_MUSIC = "https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%81%E0%B8%B8%E0%B9%8A%E0%B8%81%E0%B8%81%E0%B8%B9%E0%B9%88.mp3";

    const SEED_HIGHLIGHTS = [
      { id: "seed_one", title: "one", cover: "https://files.catbox.moe/1yyb5f.png", images: ["https://files.catbox.moe/1yyb5f.png"], order: 0 },
      { id: "seed_two", title: "two", cover: "https://files.catbox.moe/pmfrls.jpeg", images: ["https://files.catbox.moe/pmfrls.jpeg"], order: 1 },
      { id: "seed_three", title: "three", cover: "https://files.catbox.moe/6m0yw6.jpeg", images: ["https://files.catbox.moe/6m0yw6.jpeg"], order: 2 }
    ];

    const MAX_SAFE_BYTES = 720000;

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteConfig = {
      storeName: "Nongkib",
      storeBio: DEFAULT_BIO,
      bannerImg: DEFAULT_BANNER,
      profileImg: DEFAULT_PROFILE,
      highlightsTitle: "Moo Krob",
      reviewTitle: "review น้องกิ๊บแม่แมวอ้วน",
      lineLabel: "ไลน์ออฟ @556vbotd",
      lineUrl: "https://lin.ee/5YAa4Be",
      fbLabel: "เฟส",
      fbUrl: "https://www.facebook.com/share/1FXdtEkamE/",
      musicUrl: DEFAULT_MUSIC
    };

    let highlightsList = [];

    window.onload = function() {
      if (sessionStorage.getItem('nongkib_auth') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const mail = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (mail.toLowerCase() === AUTH_EMAIL.toLowerCase() && pass === AUTH_PASS) {
        sessionStorage.setItem('nongkib_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('nongkib_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_CONFIG).doc("main").get();
        if (doc.exists) siteConfig = { ...siteConfig, ...doc.data() };

        const hlSnap = await db.collection(DB_HL).orderBy("order", "asc").get();
        if (hlSnap.empty) {
          highlightsList = SEED_HIGHLIGHTS.map(x => ({ ...x, images: [...x.images] }));
        } else {
          highlightsList = [];
          hlSnap.forEach(d => {
            highlightsList.push({ id: d.id, ...d.data() });
          });
        }
      } catch (err) {
        highlightsList = SEED_HIGHLIGHTS.map(x => ({ ...x, images: [...x.images] }));
      }

      renderFields();
      listenReviews();
    }

    function renderFields() {
      document.getElementById('storeNameInput').value = siteConfig.storeName || '';
      document.getElementById('storeBioInput').value = siteConfig.storeBio || '';
      document.getElementById('lineLabelInput').value = siteConfig.lineLabel || 'ไลน์ออฟ @556vbotd';
      document.getElementById('lineUrlInput').value = siteConfig.lineUrl || 'https://lin.ee/5YAa4Be';
      document.getElementById('fbLabelInput').value = siteConfig.fbLabel || 'เฟส';
      document.getElementById('fbUrlInput').value = siteConfig.fbUrl || 'https://www.facebook.com/share/1FXdtEkamE/';
      document.getElementById('musicUrlInput').value = siteConfig.musicUrl || DEFAULT_MUSIC;
      document.getElementById('highlightsTitleInput').value = siteConfig.highlightsTitle || 'Moo Krob';
      renderHighlightsAdmin();
    }

    function renderHighlightsAdmin() {
      const box = document.getElementById('hlAdminList');
      box.innerHTML = '';

      if (highlightsList.length === 0) {
        box.innerHTML = '<p style="font-size:12px; color:var(--text-muted); padding:10px 0;">ยังไม่มีไฮไลท์ กดปุ่ม "+ เพิ่มไฮไลท์ใหม่" ได้เลยค่ะ</p>';
        return;
      }

      highlightsList.forEach((hl, idx) => {
        const card = document.createElement('div');
        card.className = 'hl-admin-card';

        let imgsHtml = '';
        if (hl.images) {
          hl.images.forEach((img, imgIdx) => {
            imgsHtml += `
              <div class="story-slot">
                <img src="${img}">
                <button type="button" class="del-btn" onclick="removeStoryImg(${idx}, ${imgIdx})">✕</button>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-weight:700; color:var(--accent-red); font-size:13.5px;">ไฮไลท์ที่ ${idx + 1} (${(hl.images || []).length} รูป)</div>
            <button type="button" onclick="removeHighlight(${idx})" style="background:none; border:none; color:#b84336; font-size:12px; font-weight:700; cursor:pointer;">ลบไฮไลท์นี้ 🗑️</button>
          </div>
          <input type="text" class="input-field" value="${escapeHtml(hl.title || '')}" placeholder="ชื่อไฮไลท์" onchange="highlightsList[${idx}].title = this.value">

          <div style="font-size:12px; margin-bottom:6px; color:var(--text-muted);">
            เปลี่ยนรูปปก: <input type="file" accept="image/*" onchange="uploadCover(event, ${idx})">
          </div>
          <div style="font-size:12px; margin-bottom:6px; color:var(--text-muted);">
            + เพิ่มรูปในไฮไลท์ (ไม่จำกัด): <input type="file" accept="image/*" multiple onchange="uploadStoryImgs(event, ${idx})">
          </div>
          <div class="stories-grid">${imgsHtml}</div>
        `;
        box.appendChild(card);
      });
    }

    function addNewHighlight() {
      highlightsList.push({
        title: `Highlight ${highlightsList.length + 1}`,
        cover: "",
        images: [],
        order: highlightsList.length
      });
      renderHighlightsAdmin();
    }

    async function removeHighlight(idx) {
      if (confirm(`ต้องการลบไฮไลท์ที่ ${idx + 1} ใช่หรือไม่คะ?`)) {
        const item = highlightsList[idx];
        if (item.id && !String(item.id).startsWith("seed_")) {
          await db.collection(DB_HL).doc(item.id).delete();
        }
        highlightsList.splice(idx, 1);
        renderHighlightsAdmin();
      }
    }

    function readFileDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
        reader.readAsDataURL(file);
      });
    }

    function encodeScaled(img, maxSide, quality) {
      const ow = img.naturalWidth || img.width || 600;
      const oh = img.naturalHeight || img.height || 600;
      let tw = ow, th = oh;
      if (Math.max(ow, oh) > maxSide) {
        if (ow >= oh) {
          tw = maxSide;
          th = Math.max(1, Math.round((oh * maxSide) / ow));
        } else {
          th = maxSide;
          tw = Math.max(1, Math.round((ow * maxSide) / oh));
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = tw;
      canvas.height = th;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, tw, th);
      return canvas.toDataURL('image/jpeg', quality);
    }

    // คงต้นฉบับไว้หากไฟล์ไม่เกินลิมิต และปรับขนาดอัตโนมัติเฉพาะไฟล์ใหญ่เกินลิมิต
    async function smartPrepareImage(file, preferredMax = 900) {
      const raw = await readFileDataUrl(file);
      if (new Blob([raw]).size <= MAX_SAFE_BYTES) return raw;

      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const steps = [
            { side: preferredMax, q: 0.85 },
            { side: 1024, q: 0.78 },
            { side: 800, q: 0.72 },
            { side: 640, q: 0.65 },
            { side: 480, q: 0.58 }
          ];
          let best = raw;
          for (const s of steps) {
            const out = encodeScaled(img, s.side, s.q);
            best = out;
            if (new Blob([out]).size <= MAX_SAFE_BYTES) {
              resolve(out);
              return;
            }
          }
          resolve(best);
        };
        img.onerror = () => reject(new Error("ประมวลผลรูปไม่สำเร็จ"));
        img.src = raw;
      });
    }

    async function uploadDirect(e, key) {
      if (e.target.files && e.target.files[0]) {
        siteConfig[key] = await smartPrepareImage(e.target.files[0], 900);
        alert("เลือกรูปเรียบร้อยแล้ว กดบันทึกขึ้นระบบเพื่ออัปเดตหน้าเว็บได้เลยค่ะ ♡");
      }
      e.target.value = '';
    }

    async function uploadCover(e, idx) {
      if (e.target.files && e.target.files[0]) {
        highlightsList[idx].cover = await smartPrepareImage(e.target.files[0], 600);
        renderHighlightsAdmin();
      }
      e.target.value = '';
    }

    async function uploadStoryImgs(e, idx) {
      const files = Array.from(e.target.files || []);
      if (!highlightsList[idx].images) highlightsList[idx].images = [];
      for (const f of files) {
        const b64 = await smartPrepareImage(f, 960);
        highlightsList[idx].images.push(b64);
      }
      renderHighlightsAdmin();
      e.target.value = '';
    }

    function removeStoryImg(hlIdx, imgIdx) {
      highlightsList[hlIdx].images.splice(imgIdx, 1);
      renderHighlightsAdmin();
    }

    async function saveAll() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = "กำลังบันทึกข้อมูล... ⏳";

      siteConfig.storeName = document.getElementById('storeNameInput').value.trim() || "Nongkib";
      siteConfig.storeBio = document.getElementById('storeBioInput').value;
      siteConfig.lineLabel = document.getElementById('lineLabelInput').value.trim() || "ไลน์ออฟ @556vbotd";
      siteConfig.lineUrl = document.getElementById('lineUrlInput').value.trim() || "https://lin.ee/5YAa4Be";
      siteConfig.fbLabel = document.getElementById('fbLabelInput').value.trim() || "เฟส";
      siteConfig.fbUrl = document.getElementById('fbUrlInput').value.trim() || "https://www.facebook.com/share/1FXdtEkamE/";
      siteConfig.musicUrl = document.getElementById('musicUrlInput').value.trim() || DEFAULT_MUSIC;
      siteConfig.highlightsTitle = document.getElementById('highlightsTitleInput').value.trim() || "Moo Krob";

      try {
        await db.collection(DB_CONFIG).doc("main").set(siteConfig);

        for (let i = 0; i < highlightsList.length; i++) {
          const hl = highlightsList[i];
          const hlData = {
            title: hl.title || `Highlight ${i + 1}`,
            cover: hl.cover || (hl.images && hl.images[0]) || DEFAULT_PROFILE,
            images: hl.images || [],
            order: i
          };
          if (hl.id && !String(hl.id).startsWith("seed_")) {
            await db.collection(DB_HL).doc(hl.id).set(hlData);
          } else {
            const docRef = await db.collection(DB_HL).add(hlData);
            hl.id = docRef.id;
          }
        }

        alert("✨ บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ!");
      } catch (err) {
        console.error(err);
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้งค่ะ");
      } finally {
        btn.disabled = false;
        btn.textContent = "☁️ บันทึกขึ้นระบบทันที (หน้าเว็บเปลี่ยนสด) ♡";
      }
    }

    function listenReviews() {
      db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
        const box = document.getElementById('reviewsBox');
        box.innerHTML = '';
        if (snap.empty) {
          box.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted);">ยังไม่มีรีวิว</p>';
          return;
        }
        snap.forEach(doc => {
          const d = doc.data();
          const div = document.createElement('div');
          div.style = "background:#fff; border:1px solid var(--border-soft); border-radius:14px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;";
          div.innerHTML = `
            <div>
              <div style="font-weight:700; font-size:13px;">${escapeHtml(d.name)} (${'★'.repeat(d.stars || 5)})</div>
              <div style="font-size:12px; color:var(--text-muted);">${escapeHtml(d.msg)}</div>
            </div>
            <button type="button" onclick="deleteReview('${doc.id}')" style="background:#fff0ed; border:none; color:#b84336; font-weight:700; padding:4px 8px; border-radius:8px; font-size:11px; cursor:pointer;">ลบ</button>
          `;
          box.appendChild(div);
        });
      });
    }

    async function deleteReview(id) {
      if (confirm("ต้องการลบรีวิวนี้ใช่หรือไม่คะ?")) {
        await db.collection(DB_REVIEWS).doc(id).delete();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
