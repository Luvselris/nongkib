<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Nongkib ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-cream: #fffaf5;
      --bg-peach: #fcdfd9;
      --bg-sage: #eef6de;
      --card-bg: rgba(255, 253, 250, 0.94);
      --border-soft: #f3d7cf;
      --accent-red: #d95a4b;
      --accent-red-deep: #b84336;
      --accent-green: #9ec45b;
      --accent-peach: #fcdfd9;
      --text-main: #4a3532;
      --text-muted: #8c6d68;
      --star-active: #d95a4b;
      --star-inactive: #eadad5;
      --shadow-soft: 0 10px 26px rgba(217, 90, 75, 0.11);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 15% 10%, #ffffff 0%, var(--bg-cream) 45%, var(--bg-peach) 85%, var(--bg-sage) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ลูกเล่นลอยไปมาฟุ้งๆ กลมๆ */
    .floating-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .soft-bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.62;
      animation: bubbleDrift 13s ease-in-out infinite alternate;
    }

    .float-circle {
      position: absolute;
      bottom: -50px;
      border-radius: 50%;
      filter: blur(1.5px);
      opacity: 0;
      animation: circleRise 12s linear infinite;
    }

    @keyframes bubbleDrift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -20px) scale(1.08); }
      100% { transform: translate(-16px, 16px) scale(0.95); }
    }

    @keyframes circleRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      18% { opacity: 0.65; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-115vh) scale(1.15); opacity: 0; }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 80px;
      position: relative;
      z-index: 2;
    }

    /* Top Nav */
    .top-nav {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 26px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-red-deep));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(217, 90, 75, 0.25);
    }

    .music-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(217, 90, 75, 0.12);
      margin-left: 6px;
      color: var(--accent-red);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Home */
    .banner-box {
      width: 100%;
      height: 155px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #ffffff;
      background: var(--bg-peach);
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    .banner-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-wrap {
      text-align: center;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
    }

    .profile-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-red), var(--accent-peach));
      box-shadow: 0 6px 18px rgba(217, 90, 75, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #ffffff;
      border: 2.5px solid #ffffff;
    }

    .profile-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .store-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-red);
      margin-top: 10px;
      text-align: center;
      letter-spacing: 0.4px;
    }

    .bio-card-box {
      background: var(--card-bg);
      border: 1.5px dashed var(--border-soft);
      border-radius: 22px;
      padding: 16px 14px;
      margin-top: 14px;
      text-align: center;
      line-height: 1.85;
      font-size: 13.5px;
      color: var(--text-main);
      white-space: pre-line;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }

    .section-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-red);
      margin: 22px 0 12px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .highlights-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      justify-content: center;
    }

    .highlights-row.scroll-left {
      justify-content: flex-start;
    }

    .highlights-row::-webkit-scrollbar { display: none; }

    .hl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hl-ring {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-red));
      box-shadow: 0 4px 12px rgba(217, 90, 75, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hl-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #ffffff;
      display: block;
    }

    .hl-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      max-width: 76px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Review Tab */
    .review-form-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .clean-input {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .clean-input:focus, .clean-textarea:focus {
      border-color: var(--accent-red);
    }

    .stars-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: var(--star-inactive);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .star-btn.active {
      color: var(--star-active);
      transform: scale(1.15);
    }

    .clean-textarea {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      background: #ffffff;
      min-height: 80px;
      resize: vertical;
      margin-bottom: 16px;
    }

    .pill-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-red-deep));
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(217, 90, 75, 0.25);
    }

    .review-bubble {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 10px;
    }

    .review-bubble-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .review-cust-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .review-stars-display {
      color: var(--star-active);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .review-cust-msg {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
      white-space: pre-line;
    }

    /* Contact Tab */
    .contact-card-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .contact-bubble-link {
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--shadow-soft);
      transition: transform 0.15s;
    }

    .contact-bubble-link:active {
      transform: scale(0.98);
    }

    .contact-bubble-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contact-circle-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-peach);
      border: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--accent-red);
      flex-shrink: 0;
    }

    /* Story Fullscreen Viewer */
    .story-modal {
      position: fixed;
      inset: 0;
      background: rgba(38, 26, 24, 0.96);
      z-index: 9999999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }
    .story-modal.show { display: flex; }

    .story-bars {
      display: flex;
      gap: 4px;
      padding: 12px 14px 6px;
      z-index: 10;
    }

    .story-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.1s linear;
    }

    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      z-index: 10;
      color: #fff;
    }

    .story-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    .story-body img {
      width: 100%;
      height: 100%;
      max-height: 92vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .story-nav-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 99999;
      cursor: pointer;
    }
    .story-nav-left { left: 0; }
    .story-nav-right { right: 0; }
  </style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto" src="https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%81%E0%B8%B8%E0%B9%8A%E0%B8%81%E0%B8%81%E0%B8%B9%E0%B9%88.mp3"></audio>

  <!-- ลูกเล่นลอยไปมาฟุ้งๆ กลมๆ -->
  <div class="floating-layer" id="floatingLayer">
    <div class="soft-bubble" style="width:210px; height:210px; top:5%; left:-50px; background:#cee386;"></div>
    <div class="soft-bubble" style="width:230px; height:230px; top:38%; right:-60px; background:#fcdfd9; animation-delay:-4s;"></div>
    <div class="soft-bubble" style="width:190px; height:190px; bottom:10%; left:8%; background:#f3b8ae; animation-delay:-8s;"></div>
  </div>

  <div class="container">

    <!-- Top Bar -->
    <div class="top-nav">
      <div class="nav-tabs">
        <button type="button" class="tab-btn active" onclick="switchNavTab('home', this)">Home</button>
        <button type="button" class="tab-btn" onclick="switchNavTab('review', this)">Review</button>
        <button type="button" class="tab-btn" onclick="switchNavTab('contact', this)">Contact</button>
      </div>
      <button type="button" class="music-btn" onclick="toggleAudio()">🎵</button>
    </div>

    <!-- 1. Home -->
    <div class="tab-content active" id="tab-home">
      <div class="banner-box">
        <img id="mainBanner" src="https://files.catbox.moe/68y4at.gif" alt="Banner">

      <div class="profile-wrap">
        <div class="profile-ring">
          <div class="profile-circle">
            <img id="mainProfile" src="https://files.catbox.moe/tfihpe.jpeg" alt="Profile">
          </div>
        </div>
      </div>

      <h1 class="store-title" id="storeNameText">Nongkib</h1>

      <div class="bio-card-box" id="bioBoxText">welcome to Nongkib shop
Open 09:00 – 22:00
รับแลกเงิน ส่งสติ๊กเกอร์ไลน์ แอพพรี เติมเกม</div>

      <div class="section-label">
        <span id="highlightsSectionTitle">Moo Krob</span>
      </div>

      <div class="highlights-row" id="highlightsBar"></div>
    </div>

    <!-- 2. Review -->
    <div class="tab-content" id="tab-review">
      <div class="review-form-card">
        <div id="reviewTopTitle" style="font-weight:700; color:var(--accent-red); font-size:15.5px; margin-bottom:12px;">review น้องกิ๊บแม่แมวอ้วน</div>
        <input type="text" id="custNameInput" class="clean-input" placeholder="ชื่อของคุณ ♡">

        <div class="stars-selector">
          <button type="button" class="star-btn active" onclick="selectStar(1)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(2)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(3)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(4)">★</button>
          <button type="button" class="star-btn active" onclick="selectStar(5)">★</button>
        </div>

        <textarea id="custMsgInput" class="clean-textarea" placeholder="เขียนรีวิวให้น้องกิ๊บได้เลยนะคะ ♡"></textarea>
        <button type="button" class="pill-btn" id="sendReviewBtn" onclick="submitReview()">sent review ♡</button>
      </div>

      <div class="section-label">
        <span>♡ รีวิวทั้งหมด</span>
      </div>
      <div id="feedbackFeed"></div>
    </div>

    <!-- 3. Contact -->
    <div class="tab-content" id="tab-contact">
      <div class="bio-card-box" style="margin-top:0;">
        <div style="font-weight:700; color:var(--accent-red); margin-bottom:4px;">contact me ♡</div>
        ทักสอบถามสั่งซื้อกดช่องทางด้านล่างได้เลยนะคะ
      </div>

      <div class="contact-card-box">
        <a id="lineLink" href="https://lin.ee/5YAa4Be" target="_blank" class="contact-bubble-link">
          <div class="contact-bubble-left">
            <div class="contact-circle-icon">💬</div>
            <div>
              <div id="lineBoxTitle" style="font-weight:700; font-size:14px; color:var(--text-main);">ไลน์ออฟ @556vbotd</div>
              <div style="font-size:12px; color:var(--text-muted);">ติดต่อสอบถาม - สั่งซื้อสินค้า</div>
            </div>
          </div>
          <span style="color:var(--accent-red); font-size:14px;">♡</span>
        </a>

        <a id="fbLink" href="https://www.facebook.com/share/1FXdtEkamE/" target="_blank" class="contact-bubble-link">
          <div class="contact-bubble-left">
            <div class="contact-circle-icon">✿</div>
            <div>
              <div id="fbBoxTitle" style="font-weight:700; font-size:14px; color:var(--text-main);">เฟส</div>
              <div style="font-size:12px; color:var(--text-muted);">ติดตามเพจ / ทักแชทเฟสบุ๊ก</div>
            </div>
          </div>
          <span style="color:var(--accent-red); font-size:14px;">♡</span>
        </a>
      </div>
    </div>

  </div>

  <!-- Story Modal -->
  <div class="story-modal" id="storyModal">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-header">
      <span id="storyTitleText" style="font-weight:700; font-size:14px;">Highlight</span>
      <button type="button" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;" onclick="closeStoryModal()">✕</button>
    </div>
    <div class="story-body">
      <div class="story-nav-btn story-nav-left" id="storyNavLeft"></div>
      <img id="storyActiveImg" src="" alt="Story" draggable="false">
      <div class="story-nav-btn story-nav-right" id="storyNavRight"></div>
    </div>
  </div>

  <script>
    const DB_CONFIG = "nongkib_config";
    const DB_HL = "nongkib_highlights";
    const DB_REVIEWS = "nongkib_reviews";

    const DEFAULT_BANNER = "https://files.catbox.moe/68y4at.gif";
    const DEFAULT_PROFILE = "https://files.catbox.moe/tfihpe.jpeg";
    const DEFAULT_BIO = "welcome to Nongkib shop\nOpen 09:00 – 22:00\nรับแลกเงิน ส่งสติ๊กเกอร์ไลน์ แอพพรี เติมเกม";
    const DEFAULT_MUSIC = "https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%81%E0%B8%B8%E0%B9%8A%E0%B8%81%E0%B8%81%E0%B8%B9%E0%B9%88.mp3";

    const SEED_HIGHLIGHTS = [
      { id: "seed_one", title: "one", cover: "https://files.catbox.moe/1yyb5f.png", images: ["https://files.catbox.moe/1yyb5f.png"], order: 0 },
      { id: "seed_two", title: "two", cover: "https://files.catbox.moe/pmfrls.jpeg", images: ["https://files.catbox.moe/pmfrls.jpeg"], order: 1 },
      { id: "seed_three", title: "three", cover: "https://files.catbox.moe/6m0yw6.jpeg", images: ["https://files.catbox.moe/6m0yw6.jpeg"], order: 2 }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const audio = document.getElementById('bgMusic');
    let audioContext;
    function unlockAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      if (audio.paused && audio.src) audio.play().catch(() => {});
    }
    window.addEventListener('load', unlockAudio);
    ['touchstart', 'touchend', 'click', 'scroll', 'pointerdown'].forEach(e => {
      document.addEventListener(e, function run() {
        unlockAudio();
        document.removeEventListener(e, run);
      }, { passive: true });
    });

    function toggleAudio() {
      if (!audio.src) audio.src = DEFAULT_MUSIC;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function switchNavTab(tabId, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    let highlightsData = [...SEED_HIGHLIGHTS];

    function applyData(d) {
      if (!d) return;
      if (d.storeName) {
        document.getElementById('storeNameText').textContent = d.storeName;
        document.getElementById('pageTitle').textContent = d.storeName + " ♡";
      }
      if (d.storeBio) document.getElementById('bioBoxText').textContent = d.storeBio;
      if (d.bannerImg) document.getElementById('mainBanner').src = d.bannerImg;
      if (d.profileImg) document.getElementById('mainProfile').src = d.profileImg;
      if (d.highlightsTitle) document.getElementById('highlightsSectionTitle').textContent = d.highlightsTitle;
      if (d.reviewTitle) document.getElementById('reviewTopTitle').textContent = d.reviewTitle;
      if (d.lineLabel) document.getElementById('lineBoxTitle').textContent = d.lineLabel;
      if (d.lineUrl) document.getElementById('lineLink').href = d.lineUrl;
      if (d.fbLabel) document.getElementById('fbBoxTitle').textContent = d.fbLabel;
      if (d.fbUrl) document.getElementById('fbLink').href = d.fbUrl;

      if (d.musicUrl && audio.src !== d.musicUrl) {
        audio.src = d.musicUrl;
      }
    }

    renderHighlights(highlightsData);

    db.collection(DB_CONFIG).doc("main").onSnapshot(doc => {
      if (doc.exists) {
        applyData(doc.data());
      }
    });

    db.collection(DB_HL).orderBy("order", "asc").onSnapshot(snap => {
      if (snap.empty) {
        highlightsData = [...SEED_HIGHLIGHTS];
        renderHighlights(highlightsData);
        return;
      }
      highlightsData = [];
      snap.forEach(doc => {
        highlightsData.push({ id: doc.id, ...doc.data() });
      });
      renderHighlights(highlightsData);
    });

    function renderHighlights(hl) {
      const bar = document.getElementById('highlightsBar');
      bar.innerHTML = '';
      if (!hl || hl.length === 0) {
        bar.innerHTML = '<span style="font-size:12px; color:var(--text-muted); padding:4px;">ยังไม่มีไฮไลท์ค่ะ ♡</span>';
        return;
      }
      bar.classList.toggle('scroll-left', hl.length > 3);
      hl.forEach((item, idx) => {
        const cover = item.cover || (item.images && item.images[0]) || DEFAULT_PROFILE;
        const div = document.createElement('div');
        div.className = 'hl-item';
        div.onclick = () => openStory(idx);
        div.innerHTML = `
          <div class="hl-ring"><img src="${cover}" alt="HL"></div>
          <div class="hl-label">${escapeHtml(item.title || 'Highlight')}</div>
        `;
        bar.appendChild(div);
      });
    }

    let activeHlIdx = 0;
    let activeSlideIdx = 0;
    let slideTimer = null;

    function openStory(idx) {
      activeHlIdx = idx;
      activeSlideIdx = 0;
      const hl = highlightsData[idx];
      const slides = (hl && hl.images && hl.images.length) ? hl.images : (hl && hl.cover ? [hl.cover] : []);
      if (!slides.length) {
        alert("ยังไม่มีรูปในไฮไลท์นี้ค่ะ ♡");
        return;
      }
      document.getElementById('storyTitleText').textContent = hl.title || 'Highlight';
      buildStoryBars(slides.length);
      showStorySlide(slides);
      document.getElementById('storyModal').classList.add('show');
    }

    function buildStoryBars(count) {
      const bars = document.getElementById('storyBars');
      bars.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const bar = document.createElement('div');
        bar.className = 'story-bar';
        bar.innerHTML = `<div class="story-bar-fill" id="sb-${i}"></div>`;
        bars.appendChild(bar);
      }
    }

    function showStorySlide(slidesOverride) {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      const slides = slidesOverride || ((hl && hl.images && hl.images.length) ? hl.images : (hl && hl.cover ? [hl.cover] : []));
      if (!slides.length) return;

      document.getElementById('storyActiveImg').src = slides[activeSlideIdx];

      slides.forEach((_, i) => {
        const fill = document.getElementById(`sb-${i}`);
        if (!fill) return;
        if (i < activeSlideIdx) fill.style.width = '100%';
        else if (i === activeSlideIdx) {
          fill.style.width = '0%';
          setTimeout(() => { fill.style.width = '100%'; }, 50);
        } else fill.style.width = '0%';
      });

      slideTimer = setTimeout(() => nextStorySlide(slides), 5000);
    }

    function nextStorySlide(slidesOverride) {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      const slides = slidesOverride || ((hl && hl.images && hl.images.length) ? hl.images : (hl && hl.cover ? [hl.cover] : []));
      if (activeSlideIdx < slides.length - 1) {
        activeSlideIdx++;
        showStorySlide(slides);
      } else {
        closeStoryModal();
      }
    }

    function prevStorySlide() {
      clearTimeout(slideTimer);
      if (activeSlideIdx > 0) {
        activeSlideIdx--;
        showStorySlide();
      }
    }

    function closeStoryModal() {
      clearTimeout(slideTimer);
      document.getElementById('storyModal').classList.remove('show');
    }

    function bindTap(el, cb) {
      if (!el) return;
      let sx = 0, sy = 0, st = 0;
      el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); }, { passive: true });
      el.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - sx) < 15 && Math.abs(e.clientY - sy) < 15 && (Date.now() - st) < 450) {
          e.preventDefault();
          cb();
        }
      });
    }
    bindTap(document.getElementById('storyNavRight'), () => nextStorySlide());
    bindTap(document.getElementById('storyNavLeft'), prevStorySlide);

    let currentRating = 5;
    function selectStar(num) {
      currentRating = num;
      document.querySelectorAll('.star-btn').forEach((b, i) => {
        b.classList.toggle('active', i < num);
      });
    }

    async function submitReview() {
      const name = document.getElementById('custNameInput').value.trim();
      const msg = document.getElementById('custMsgInput').value.trim();
      const btn = document.getElementById('sendReviewBtn');
      if (!name || !msg) {
        alert("กรุณากรอกชื่อและข้อความรีวิวด้วยนะคะ ♡");
        return;
      }
      btn.disabled = true;
      try {
        await db.collection(DB_REVIEWS).add({
          name: name,
          msg: msg,
          stars: currentRating,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('custNameInput').value = '';
        document.getElementById('custMsgInput').value = '';
        selectStar(5);
        alert("ส่งรีวิวเรียบร้อยแล้วค่ะ ขอบคุณมากนะคะ ♡");
      } catch (e) {
        alert("เกิดข้อผิดพลาดในการส่งรีวิว");
      } finally {
        btn.disabled = false;
      }
    }

    db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById('feedbackFeed');
      box.innerHTML = '';
      if (snap.empty) {
        box.innerHTML = '<p style="text-align:center; font-size:12.5px; color:var(--text-muted); padding:10px;">ยังไม่มีรีวิว มารีวิวเป็นคนแรกได้เลยนะคะ ♡</p>';
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const div = document.createElement('div');
        div.className = 'review-bubble';
        div.innerHTML = `
          <div class="review-bubble-head">
            <span class="review-cust-name">${escapeHtml(d.name)}</span>
            <span class="review-stars-display">${'★'.repeat(d.stars || 5)}</span>
          </div>
          <div class="review-cust-msg">${escapeHtml(d.msg)}</div>
        `;
        box.appendChild(div);
      });
    });

    // ลูกเล่นวงกลมฟุ้งๆ ลอยขึ้นเรื่อยๆ
    const bubbleColors = ['#cee386', '#d95a4b', '#fcdfd9', '#e6efcb'];
    const floatBox = document.getElementById('floatingLayer');
    setInterval(() => {
      const el = document.createElement('div');
      el.className = 'float-circle';
      const size = 14 + Math.random() * 18;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
      el.style.left = (5 + Math.random() * 88) + 'vw';
      el.style.animationDuration = (10 + Math.random() * 5) + 's';
      floatBox.appendChild(el);
      setTimeout(() => el.remove(), 15500);
    }, 1500);

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
